services:
  db:
    image: postgres:16-alpine
    container_name: bookstore-db
    environment:
      POSTGRES_USER: bookstore
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: bookstore
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookstore -d bookstore"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    image: migrate/migrate:v4.18.1
    profiles: ["tools"]
    volumes:
      - ../migrations:/migrations
    entrypoint:
      [
        "migrate",
        "-path", "/migrations",
        "-database", "postgres://bookstore:secret@db:5432/bookstore?sslmode=disable",
      ]
    command: ["up"]
    depends_on:
      db:
        condition: service_healthy

  api:
    image: golang:1.26
    profiles: ["app"]
    env_file: ../.env
    environment:
      POSTGRES_HOST_MASTER: db
      POSTGRES_HOST_SLAVE: db
    ports:
      - "8080:8080"
    volumes:
      - ..:/app
    working_dir: /app
    command: ["go", "run", ".", "http:start"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
